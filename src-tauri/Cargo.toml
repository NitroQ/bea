[package]
name = "bea-core"
version = "0.1.0"
edition = "2021"

[package.metadata.tauri]
bundle = { active = true, targets = ["msi", "nsis"], icon = ["icons/icon.ico", "icons/icon.png"] }

[lib]
name = "bea_core"
path = "src/lib.rs"

[[bin]]
name = "bea"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
bzip2 = "0.4"
cpal = "0.15"
hound = "3.5"
keyring = { version = "3", features = ["windows-native"] }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip", "brotli", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sherpa-onnx = "1.13.5"
thiserror = "2"
tar = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
tokio = { version = "1.53.1", features = ["time"] }
base64 = { version = "0.23.1", default-features = false, features = ["std"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.53.1", features = ["rt", "macros", "time"] }
